name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run Tests, Build, and Verify API Compatibility
        run: ./gradlew --no-daemon clean test build verifyApiCompatibility prepareCiRuntimeArtifact

      - name: Analyze with SonarQube Cloud
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" ]]; then
            echo "::notice::Skipping SonarQube analysis because its repository secrets are unavailable."
            exit 0
          fi
          ./gradlew --no-daemon sonar

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
            build/test-results/test
          if-no-files-found: ignore

      - name: Upload JAR Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-jar
          path: build/ci-artifacts/Airdrop.jar
          if-no-files-found: error

  lightkeeper-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: economy-gui
            task: lightkeeperScenarioTest
            tests: PaidEconomyIT,PackageGuiIT,EconomyNoProviderIT,GiftGrantIT
          - lane: lifecycle
            task: lightkeeperScenarioTest
            tests: StarterDropIT,DropLifecycleIT,ApiConsumerIT,InventoryReplacementIT,PaidCrateLifecycleIT
          - lane: fresh-install
            task: lightkeeperFreshInstallTest
            tests: FreshInstallIT

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Java 21 and Maven Cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            lightkeeper/pom.xml
            lightkeeper/lightkeeper-maven-plugin-adapter.pom.xml
            lightkeeper/bootstrap-lightkeeper-plugin.sh
            lightkeeper/.mvn/wrapper/maven-wrapper.properties

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run LightKeeper Integration Test
        env:
          LIGHTKEEPER_TASK: ${{ matrix.task }}
          ORG_GRADLE_PROJECT_lightkeeperTests: ${{ matrix.tests }}
        run: ./gradlew --no-daemon "$LIGHTKEEPER_TASK"

      - name: Summarize LightKeeper Timings
        if: always()
        run: ./scripts/lightkeeper-timings >> "$GITHUB_STEP_SUMMARY"

      - name: Sanitize LightKeeper Runtime Manifest
        if: always()
        shell: bash
        run: |
          for manifest in lightkeeper/target/lightkeeper/runtime-manifest.json \
              lightkeeper/target/lightkeeper/runtime-manifest-fresh-install.json; do
            if [[ -f "$manifest" ]]; then
              mkdir -p lightkeeper/target/lightkeeper-diagnostics
              jq 'del(.agentAuthToken)' "$manifest" \
                > "lightkeeper/target/lightkeeper-diagnostics/$(basename "$manifest")"
            fi
          done

      - name: Upload LightKeeper Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightkeeper-diagnostics-${{ matrix.lane }}
          path: |
            lightkeeper/target/failsafe-reports
            lightkeeper/target/lightkeeper-reports
            lightkeeper/target/lightkeeper-diagnostics
            lightkeeper/target/lightkeeper-server
          if-no-files-found: ignore
