name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Tests and Build
        run: ./gradlew --no-daemon clean test build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

      - name: Upload JAR Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error

  lightkeeper-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Java 21 and Maven Cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            lightkeeper/pom.xml
            lightkeeper/lightkeeper-maven-plugin-adapter.pom.xml
            lightkeeper/bootstrap-lightkeeper-plugin.sh
            lightkeeper/.mvn/wrapper/maven-wrapper.properties

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run LightKeeper Integration Test
        run: ./gradlew --no-daemon lightkeeperTest

      - name: Sanitize LightKeeper Runtime Manifest
        if: always()
        shell: bash
        run: |
          manifest="lightkeeper/target/lightkeeper/runtime-manifest.json"
          if [[ -f "$manifest" ]]; then
            mkdir -p lightkeeper/target/lightkeeper-diagnostics
            jq 'del(.agentAuthToken)' "$manifest" \
              > lightkeeper/target/lightkeeper-diagnostics/runtime-manifest.json
          fi

      - name: Upload LightKeeper Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightkeeper-diagnostics
          path: |
            lightkeeper/target/failsafe-reports
            lightkeeper/target/lightkeeper-reports
            lightkeeper/target/lightkeeper-diagnostics
            lightkeeper/target/lightkeeper-server
          if-no-files-found: ignore
