name: Release Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}

    steps:
      - name: Checkout Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, Test, and Verify Release
        id: release
        env:
          ORG_GRADLE_PROJECT_releaseTag: ${{ github.event.release.tag_name }}
        run: ./gradlew --no-daemon clean test build verifyReleaseArtifact

      - name: Upload Release JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jar
          path: ${{ steps.release.outputs.artifact_path }}
          if-no-files-found: error

  publish-github:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download Release JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jar
          path: release-jar

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-jar/${{ needs.build.outputs.artifact_name }}

  publish-modrinth:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Release JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jar
          path: release-jar

      - name: Prepare Modrinth Metadata
        id: meta
        run: |
          RELEASE_TYPE="release"
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            RELEASE_TYPE="beta"
          fi

          LOADERS="${{ vars.MODRINTH_LOADERS }}"
          if [ -z "$LOADERS" ]; then
            LOADERS="paper"
          fi

          GAME_VERSIONS="${{ vars.MODRINTH_GAME_VERSIONS }}"
          if [ -z "$GAME_VERSIONS" ]; then
            GAME_VERSIONS="1.21.8"
          fi

          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "loaders=$LOADERS" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Validate Modrinth Configuration
        run: |
          if [ -z "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "Missing required secret: MODRINTH_TOKEN"
            exit 1
          fi
          if [ -z "${{ vars.MODRINTH_PROJECT_ID }}" ]; then
            echo "Missing required repository variable: MODRINTH_PROJECT_ID"
            exit 1
          fi

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ github.event.release.tag_name }}
          modrinth-version-type: ${{ steps.meta.outputs.release_type }}
          modrinth-changelog: ${{ github.event.release.body }}
          modrinth-loaders: ${{ steps.meta.outputs.loaders }}
          modrinth-game-versions: ${{ steps.meta.outputs.game_versions }}
          modrinth-files: release-jar/${{ needs.build.outputs.artifact_name }}
