name: Release Publish

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        run: ./gradlew --no-daemon clean test build

      - name: Upload Release JAR
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/*.jar
          if-no-files-found: error

  publish-github:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Release JAR
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: release-jar

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-jar/*.jar

  publish-modrinth:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Release JAR
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: release-jar

      - name: Prepare Modrinth Metadata
        id: meta
        run: |
          RELEASE_TYPE="release"
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            RELEASE_TYPE="beta"
          fi

          LOADERS="${{ vars.MODRINTH_LOADERS }}"
          if [ -z "$LOADERS" ]; then
            LOADERS="paper"
          fi

          GAME_VERSIONS="${{ vars.MODRINTH_GAME_VERSIONS }}"
          if [ -z "$GAME_VERSIONS" ]; then
            GAME_VERSIONS="1.21.8"
          fi

          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "loaders=$LOADERS" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Validate Modrinth Configuration
        run: |
          if [ -z "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "Missing required secret: MODRINTH_TOKEN"
            exit 1
          fi
          if [ -z "${{ vars.MODRINTH_PROJECT_ID }}" ]; then
            echo "Missing required repository variable: MODRINTH_PROJECT_ID"
            exit 1
          fi

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ github.event.release.tag_name }}
          modrinth-version-type: ${{ steps.meta.outputs.release_type }}
          modrinth-changelog: ${{ github.event.release.body }}
          modrinth-loaders: ${{ steps.meta.outputs.loaders }}
          modrinth-game-versions: ${{ steps.meta.outputs.game_versions }}
          modrinth-files: release-jar/*.jar
