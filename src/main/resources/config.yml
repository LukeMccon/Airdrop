# Airdrop Configuration

# Language setting - corresponds to file in lang/ folder
language: en

# Drop Settings
drop:
  parachute:
    # Number of chickens to use for the parachute system
    # Warning: Increasing this may cause some chickens to be unleashed
    chicken-count: 5
  particles:
    # Whether to show particle effects when the package lands
    landing-effects: true
    # Whether to show continuous particle effects while the package exists
    continuous-effects: true
    # Whether to show the flare effect when the package is dropped
    flare-effects: true
    smoke:
      # Whether to show the smoke trail effect
      enabled: false
      # Height of the smoke trail effect in blocks
      height: 20
  # How fast the crate falls when dropped
  falling-speed: 0.3
  # Height in blocks from which to drop the crate
  height: 20
  limits:
    # Minimum time between successful player-requested drops
    request-cooldown-seconds: 30
    # Maximum number of crates falling at once
    max-falling: 3
    # Maximum number of landed crates plus reserved landing slots for new drops
    # Existing paid barrels recovered from disk may temporarily exceed this value
    max-landed: 10
    # Seconds before Airdrop stops tracking a landed crate
    # Non-empty paid barrels become ordinary barrels instead of being removed
    landed-lifetime-seconds: 600

# Economy settings
economy:
  # Whether to enable paid package drops
  # When false, packages priced above zero are blocked
  enabled: true

# Logging settings
logging:
  # Enables additional debug logs for troubleshooting
  debug: false

# UI theme settings
ui:
  chat:
    # ChatColor names, e.g. BLUE, AQUA, RED (case-insensitive)
    colors:
      primary: BLUE
      text: WHITE
      accent: AQUA
      success: GREEN
      warning: YELLOW
      error: RED
      error-detail: DARK_RED
