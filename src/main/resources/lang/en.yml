prefix: "{primary}[{text}Airdrop{primary}]"

commands:
  player-only: "Must be a player to use this command"
  packages-console-only: "Uses inventory GUI, not available to the console"
  package-specify: "Must specify a package name"
  package-example: "Example: /airdrop starter"
  help:
    header: "{primary}Airdrop commands"
    drop: "{text}/airdrop <package>{primary} — request a package; press Tab to see packages you can use"
    package: "{text}/airdrop package <name>{primary} — inspect a package"
    version: "{text}/airdrop version{primary} — show compatibility information"
    admin-create: "{text}/airdrop package create <name> <price>{primary} — create a package"
    admin-delete: "{text}/airdrop package delete <name>{primary} — delete a package"
    admin-packages: "{text}/airdrop packages{primary} — open package management"
    admin-reload: "{text}/airdrop reload{primary} — reload configuration"
    admin-status: "{text}/airdrop status{primary} — show operational status"

packages:
  info: "{text}\nPackage info for: {accent}{name}{text}\n================\n{text}{info}"
  info-price: "price: {price}"
  deleted: "{accent}{name}{primary} was successfully deleted"
  saved: "Package {accent}{name}{primary} was saved successfully"
  created: "Package {accent}{name}{primary} was created successfully"
  edit-canceled: "Package edit was canceled"
  create-canceled: "Package creation was canceled"
  delete-specify: "Need to specify a package name to delete"
  delete-permission: "Must be an admin with {accent}airdrop.admin{error} permissions or a server operator to delete a package"
  create-args: "Package create command requires a name and price"
  create-usage: "Usage: /airdrop package create <name> <price>"
  create-example: "Example: /airdrop package create starter 12.0"
  name-required: "You must provide a name for the package"
  name-invalid: "Package names may only contain letters, numbers, underscores, and dashes"
  name-reserved: "Package names cannot use reserved names: all, *, package, packages, version, status, reload"
  name-subcommand-reserved: "The package names create and delete are reserved because they are package subcommands"
  price-required: "You must provide the package price as a double"
  price-invalid: "Package price must be a finite non-negative number"
  create-open-error: "Unable to open package editor right now"
  item-limit: "Package can only hold {accent}{max}{error} item stacks (barrel capacity). Remove extra items before saving."

errors:
  cannot-afford: "{accent}{player}{error} cannot afford package price of {accent}{price}{error}"
  insufficient-permissions: "You lack permission to drop that package (requires {accent}{permission}{error})"
  economy-unavailable: "Priced packages are unavailable because economy is disabled or no provider is available. Contact a server administrator."
  plugin-not-ready: "Airdrop is still starting or is shutting down. Try again shortly."
  reload-unavailable: "Reload unavailable while plugin is shutting down"
  status-unavailable: "Airdrop status is unavailable"
  reload-failed-retained: "Reload failed. The previous configuration remains active. Check the server log."
  packages-reload-failed: "Reload failed because packages configuration is unavailable"
  sky-not-clear: "Sky must be clear above your location to call an airdrop"
  package-not-found: "Package {accent}{name}{error} not found. Type {warning}/airdrop{error} and press Tab to see packages you can use, or inspect one with {warning}/airdrop package <name>"
  package-exists: "A package named {accent}{name}{error} already exists"
  package-delete-not-found: "Unable to delete package: {error-detail}{name}{error} not found"
  package-save-failed: "Could not save package changes. No changes were made. Check the server log."
  drop-request-pending: "A drop request is already being processed"
  drop-cooldown: "Wait {seconds} seconds before requesting another airdrop"
  drop-falling-limit: "Too many airdrops are currently falling; try again shortly"
  drop-landed-limit: "Too many landed airdrops are active; try again later"
  drop-location-reserved: "An airdrop already owns this landing location"
  drop-shutting-down: "Airdrops are unavailable while the plugin is shutting down"

drop:
  charged: "{accent}${amount}{primary} has been taken from your account"
  failed: "Airdrop failed; no crate was created"
  refunded: "Airdrop failed; your payment was refunded"

gui:
  save: "Save"
  cancel: "Cancel"
  back: "Back"
  help: "Help"
  editor-help-add-stack: "Left-click inventory: add stack"
  editor-help-add-one: "Right-click inventory: add 1"
  editor-help-remove-stack: "Left-click package: remove stack"
  editor-help-remove-one: "Right-click package: remove 1"
  packages-title: "Packages"
  package-price: "${price}"

admin:
  permission-required: "You must have {accent}airdrop.admin{error} permission to do this"
  package-save-required: "Must be admin to save package changes"

system:
  config-loaded: "Config loaded successfully"
  reload-started: "Reloading configuration..."
  reload-economy-active: "Configuration, language, packages, and economy reloaded. Provider: {accent}{provider}{primary}"
  reload-economy-disabled: "Configuration, language, packages, and economy reloaded. Economy is disabled; priced packages are blocked"
  reload-economy-unavailable: "Reload completed, but no economy provider is available; paid drops are blocked"
  package-price-missing: "Could not find price for package: {accent}{name}"
  package-price-invalid: "Invalid package price for {accent}{name}{primary}: {accent}{price}{primary}. Falling back to 0.0"
  version-info: "{primary}━━━━━━━━━━━━━━━━━━━━━━━━\n{text}  Plugin: {accent}{plugin_version}\n{text}  Extension API: {accent}{extension_api_version}\n{text}  Paper compatibility: {accent}{paper_version}\n{text}  Java compatibility: {accent}{java_version}\n{primary}━━━━━━━━━━━━━━━━━━━━━━━━\n{text}  Docs: {accent}{docs_url}"
  status-values:
    none: "none"
    not-published: "not published"
  status-info: "{primary}━━━━━━━━━━━━━━━━━━━━━━━━\n{text}  Plugin: {accent}{plugin_version}\n{text}  Extension API: {accent}{extension_api_version}\n{text}  Paper compatibility: {accent}{paper_version}\n{text}  Java compatibility: {accent}{java_version}\n{text}  Readiness: {accent}{readiness}\n{text}  Economy: {accent}{economy}{text} (provider: {accent}{economy_provider}{text})\n{text}  Packages: {accent}{package_count}{text} (revision {accent}{package_revision}{text})\n{text}  Pending requests: {accent}{pending_count}\n{text}  Falling drops: {accent}{falling_count}{text} / {accent}{max_falling}\n{text}  Landed drops: {accent}{landed_count}{text} / {accent}{max_landed}\n{text}  Diagnostic: {accent}{diagnostic_category}{diagnostic}\n{primary}━━━━━━━━━━━━━━━━━━━━━━━━\n{text}  Docs: {accent}{docs_url}"
