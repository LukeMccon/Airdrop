gui:
  save: "Save"
  cancel: "Cancel"
  back: "Back"
  packages-title: "Packages"
  package-price: "${price}"

admin:
  permission-required: "You must have airdrop.admin permission to do this"
  package-save-required: "Must be admin to save package changes"

system:
  config-loaded: "Config loaded successfully"
  vault-missing: "Disabling due to missing Vault dependency"
  reload-success: "Configuration and language reloaded"
