name: Vault
version: 1.0.0
main: com.airdropmc.lightkeeper.economy.LightkeeperEconomyPlugin
api-version: '1.21.11'
load: STARTUP
description: Deterministic economy provider for Airdrop LightKeeper tests
commands:
  airdrop-lightkeeper-inventory-replacement:
    description: Verifies stale inventory events against a replacement crate
    usage: /airdrop-lightkeeper-inventory-replacement <capture|verify> <arguments>
  airdrop-lightkeeper-block-explode:
    description: Triggers a source-less Paper block explosion for integration tests
    usage: /airdrop-lightkeeper-block-explode <world> <x> <y> <z> <power>
  lkmenu-close:
    description: Closes the player's current inventory through Paper for integration tests
    usage: /lkmenu-close <playerUUID> <token>
  airdrop-lightkeeper-paid-lifecycle:
    description: Observes paid crate persistence and scheduled expiry for integration tests
    usage: /airdrop-lightkeeper-paid-lifecycle <action> <token> <arguments>
  lkeconomy:
    description: Controls the LightKeeper economy fixture
    usage: /lkeconomy <enable|disable|reset|report|fault|release|clear> <arguments>
    permission: lkeconomy.admin
permissions:
  lkeconomy.admin:
    default: op
