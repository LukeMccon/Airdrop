# Gradle build properties
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Airdrop compatibility contract (single source for generated metadata and checks)
airdropPluginVersion=5.0.0-SNAPSHOT
airdropExtensionApiVersion=1.0.0
airdropPaperVersion=1.21.11
airdropJavaVersion=21
airdropJapicmpVersion=0.26.1
# AIRDR-43 still owns the last supported 1.0 surface change. Flip this to true
# only when config/api-signatures/1.0.0.txt is regenerated from that final tip.
airdropApiBaselineRequired=false

# Paper dev bundle cache
# This helps speed up builds by caching the Paper dev bundle
paperweight.experimental.sharedCaches=true
